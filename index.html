<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모의재판 투표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#F0F4F8;min-height:100vh;padding:16px}
h1{text-align:center;font-size:22px;font-weight:700;color:#1a2a4a;margin-bottom:4px;padding-top:8px}
.subtitle{text-align:center;font-size:13px;color:#6b7a99;margin-bottom:18px}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.nav-btn{font-size:12px;padding:6px 13px;border-radius:20px;border:1.5px solid #c8d3e8;background:#fff;color:#4a5a7a;cursor:pointer;font-weight:500;transition:all .15s}
.nav-btn:hover{border-color:#1A5894;color:#1A5894}
.nav-btn.active-civil{background:#1A5894;color:#fff;border-color:#1A5894}
.nav-btn.active-crim{background:#7B3318;color:#fff;border-color:#7B3318}
.card{background:#fff;border-radius:16px;overflow:hidden;max-width:560px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.card-head{padding:18px 20px 14px}
.type-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.civil-badge{background:#dbeafe;color:#1e3a8a}
.crim-badge{background:#fde8d8;color:#7c2d12}
.card-head h2{font-size:15px;font-weight:700;color:#1a2a4a;line-height:1.55}
.divider{height:1px;background:#eef0f5}
.opts{padding:14px 20px 6px}
.opt-btn{width:100%;text-align:left;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:10px}
.opt-btn:hover:not(:disabled){background:#f7f9fc;border-color:#93b4d4}
.opt-btn:disabled{cursor:default}
.opt-btn.sel-civil{border-color:#1A5894;background:#eff6ff}
.opt-btn.sel-crim{border-color:#7B3318;background:#fff7f3}
.opt-left{flex:1;min-width:0}
.opt-text{font-size:13px;color:#1a2a4a;line-height:1.55;font-weight:500}
.side-pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;margin-top:6px}
.sp-plaintiff{background:#dcfce7;color:#14532d}
.sp-defendant{background:#fee2e2;color:#7f1d1d}
.sp-neutral{background:#f1f5f9;color:#475569}
.check{width:20px;height:20px;border-radius:50%;border:1.5px solid #c8d3e8;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.opt-btn.sel-civil .check{background:#1A5894;border-color:#1A5894}
.opt-btn.sel-crim .check{background:#7B3318;border-color:#7B3318}
.results{padding:4px 20px 10px}
.res-row{margin-bottom:11px}
.res-meta{display:flex;justify-content:space-between;margin-bottom:4px}
.res-label{font-size:11px;color:#6b7a99;max-width:75%}
.res-stat{font-size:11px;font-weight:700;color:#1a2a4a}
.bar-track{height:9px;background:#eef0f5;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.fill-civil{background:#1A5894}
.fill-crim{background:#7B3318}
.total{font-size:11px;color:#a0aec0;text-align:right;padding:2px 20px 12px}
.submit-area{padding:0 20px 18px}
.submit-btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.submit-btn:active{transform:scale(.98)}
.sub-civil{background:#1A5894;color:#fff}
.sub-crim{background:#7B3318;color:#fff}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.voted-msg{text-align:center;font-size:13px;color:#6b7a99;padding:4px 0 2px;font-weight:500}
.reset-btn{display:block;margin:6px auto 0;background:none;border:none;font-size:11px;color:#a0aec0;cursor:pointer;text-decoration:underline}
.loading{text-align:center;padding:20px;font-size:13px;color:#6b7a99}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<h1>모의재판 판결 투표</h1>
<p class="subtitle">재판을 보고 난 후, 여러분의 판결을 선택해 주세요!</p>
<div class="nav" id="nav"></div>
<div id="main"><div class="loading">불러오는 중...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://mocktrial-vote-default-rtdb.firebaseio.com"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const TRIALS = [
  { id:0, name:"① 심청이", type:"민사",
    q:"심청이의 계약은 유효할까요? 판사라면 어떤 판결을 내리겠습니까?",
    opts:[
      {text:"계약은 유효 — 심청이는 공양미 삼백 석을 반환하고 손해를 배상해야 한다", side:"plaintiff", sideLabel:"원고(뱃사람) 승소"},
      {text:"계약은 무효 — 생명을 담보로 한 계약은 법적으로 인정할 수 없다", side:"defendant", sideLabel:"피고(심청) 승소"},
      {text:"일부 인정 — 공양미만 반환하고 추가 손해배상은 없다", side:"neutral", sideLabel:"부분 인정"},
    ]},
  { id:1, name:"② 홍길동", type:"형사",
    q:"홍길동의 행동은 범죄일까요, 정의일까요? 판사라면 어떤 판결을 내리겠습니까?",
    opts:[
      {text:"유죄 — 동기와 관계없이 절도·주거침입은 법을 어긴 범죄다", side:"plaintiff", sideLabel:"검사(원고) 승소"},
      {text:"무죄 — 불의를 바로잡으려 한 정당행위로 처벌할 수 없다", side:"defendant", sideLabel:"피고인(홍길동) 승소"},
      {text:"유죄이지만 감형 — 범죄이나 사회적 동기를 고려해 형을 줄여준다", side:"neutral", sideLabel:"부분 인정"},
    ]},
  { id:2, name:"③ 흥부·놀부", type:"민사",
    q:"놀부는 흥부에게 재산을 나눠줘야 할까요? 판사라면 어떤 판결을 내리겠습니까?",
    opts:[
      {text:"절반 분할 — 유언 없이 사망했으므로 법정 상속분에 따라 균등 분배", side:"plaintiff", sideLabel:"원고(흥부) 승소"},
      {text:"놀부에게 더 많이 — 부모를 봉양한 기여분을 인정해 놀부 몫이 더 크다", side:"neutral", sideLabel:"부분 인정"},
      {text:"흥부 청구 기각 — 흥부가 부모를 돌보지 않았으므로 상속 권리가 없다", side:"defendant", sideLabel:"피고(놀부) 승소"},
    ]},
  { id:3, name:"④ 라푼젤", type:"형사",
    q:"고델의 행동은 보호였을까요, 범죄였을까요? 판사라면 어떤 판결을 내리겠습니까?",
    opts:[
      {text:"유죄 (중형) — 장기 감금과 아동학대는 명백한 범죄, 엄중히 처벌", side:"plaintiff", sideLabel:"검사(원고) 승소"},
      {text:"유죄 (경감) — 범죄이나 보호 의도를 고려해 형을 줄여준다", side:"neutral", sideLabel:"부분 인정"},
      {text:"무죄 — 나름의 방식으로 라푼젤을 보호하려 한 것이므로 처벌할 수 없다", side:"defendant", sideLabel:"피고인(고델) 승소"},
    ]},
  { id:4, name:"⑤ 아기돼지", type:"민사",
    q:"늑대는 삼형제에게 손해를 배상해야 할까요? 판사라면 어떤 판결을 내리겠습니까?",
    opts:[
      {text:"전액 배상 — 고의로 집을 무너뜨렸으므로 재산·정신적 피해 모두 배상", side:"plaintiff", sideLabel:"원고(삼형제) 승소"},
      {text:"일부 배상 — 고의성은 있으나 집 구조도 부실해서 배상액을 줄인다", side:"neutral", sideLabel:"부분 인정"},
      {text:"배상 없음 — 고의가 아닌 사고였으므로 늑대에게 책임을 물을 수 없다", side:"defendant", sideLabel:"피고(늑대) 승소"},
    ]},
  { id:5, name:"⑥ 인어공주", type:"민사",
    q:"우르술라와의 계약은 무효일까요? 판사라면 어떤 판결을 내리겠습니까?",
    opts:[
      {text:"계약 무효 + 배상 — 불공정 계약이므로 무효이고 정신적 피해도 배상해야 한다", side:"plaintiff", sideLabel:"원고(인어공주) 승소"},
      {text:"계약 무효만 인정 — 계약은 무효이나 우르술라에게 배상 책임은 없다", side:"neutral", sideLabel:"부분 인정"},
      {text:"계약 유효 — 인어공주가 자발적으로 서명했으므로 계약은 유효하다", side:"defendant", sideLabel:"피고(우르술라) 승소"},
    ]},
];

const MK = 'mcourt_v3_my';
function loadM(){ try{ return JSON.parse(localStorage.getItem(MK))||Array(6).fill(null); }catch(e){ return Array(6).fill(null); } }
function saveM(v){ try{ localStorage.setItem(MK,JSON.stringify(v)); }catch(e){} }

let myV = loadM();
let cur = 0;
let pend = Array(6).fill(null);
let liveVotes = TRIALS.map(() => [0,0,0]);

function civil(t){ return t.type==='민사'; }
function pct(v,tot){ return tot===0?0:Math.round(v/tot*100); }

// Firebase 실시간 연결
TRIALS.forEach((t, i) => {
  const vRef = ref(db, `votes/trial_${i}`);
  onValue(vRef, (snap) => {
    const data = snap.val();
    if (data) {
      liveVotes[i] = [data.o0||0, data.o1||0, data.o2||0];
    } else {
      liveVotes[i] = [0,0,0];
    }
    if (i === cur) renderMain();
  });
});

function renderNav(){
  document.getElementById('nav').innerHTML = TRIALS.map((t,i)=>{
    let cls='nav-btn';
    if(i===cur) cls+=civil(t)?' active-civil':' active-crim';
    return `<button class="${cls}" onclick="go(${i})">${t.name}</button>`;
  }).join('');
}

function renderMain(){
  const t = TRIALS[cur];
  const cv = civil(t);
  const voted = myV[cur] !== null;
  const v = liveVotes[cur];
  const total = v.reduce((a,b)=>a+b,0);
  const sel = pend[cur];
  const sideClass = {plaintiff:'sp-plaintiff', defendant:'sp-defendant', neutral:'sp-neutral'};

  const optHtml = t.opts.map((o,i)=>{
    const isSel = sel===i;
    const selCls = isSel?(cv?' sel-civil':' sel-crim'):'';
    const chk = isSel?`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`:'';
    return `<button class="opt-btn${selCls}" onclick="sel(${i})" ${voted?'disabled':''}>
      <div class="opt-left">
        <div class="opt-text">${o.text}</div>
        <span class="side-pill ${sideClass[o.side]}">${o.sideLabel}</span>
      </div>
      <div class="check">${chk}</div>
    </button>`;
  }).join('');

  const barHtml = t.opts.map((o,i)=>{
    const p = pct(v[i], total);
    const mine = myV[cur]===i?' ✓':'';
    const short = o.text.length>30 ? o.text.slice(0,30)+'…' : o.text;
    return `<div class="res-row">
      <div class="res-meta">
        <span class="res-label">${short}${mine}</span>
        <span class="res-stat">${v[i]}표 · ${p}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${cv?'fill-civil':'fill-crim'}" style="width:${p}%"></div></div>
    </div>`;
  }).join('');

  const subCls = cv?'sub-civil':'sub-crim';
  document.getElementById('main').innerHTML=`
    <div class="card">
      <div class="card-head">
        <span class="type-badge ${cv?'civil-badge':'crim-badge'}">${t.type}재판</span>
        <h2>${t.q}</h2>
      </div>
      <div class="divider"></div>
      <div class="opts">${optHtml}</div>
      <div class="divider"></div>
      <div class="results">${barHtml}</div>
      <div class="total">총 ${total}표</div>
      <div class="submit-area">
        ${voted
          ? `<div class="voted-msg">투표 완료! 전체 결과가 실시간 반영됩니다.</div>
             <button class="reset-btn" onclick="resetV()">내 투표 취소하기</button>`
          : `<button class="submit-btn ${subCls}" onclick="submit()" ${sel===null?'disabled':''}>판결 투표하기</button>`
        }
      </div>
    </div>`;
}

window.go = function(i){ cur=i; renderNav(); renderMain(); }
window.sel = function(i){ if(myV[cur]!==null)return; pend[cur]=i; renderMain(); }

window.submit = async function(){
  const i = pend[cur];
  if(i===null) return;
  const vRef = ref(db, `votes/trial_${cur}/o${i}`);
  await runTransaction(vRef, (current) => (current||0)+1);
  myV[cur] = i;
  saveM(myV);
  renderMain();
}

window.resetV = async function(){
  const prev = myV[cur];
  if(prev===null) return;
  const vRef = ref(db, `votes/trial_${cur}/o${prev}`);
  await runTransaction(vRef, (current) => Math.max(0,(current||0)-1));
  myV[cur] = null;
  pend[cur] = null;
  saveM(myV);
  renderMain();
}

renderNav();
renderMain();
</script>
</body>
</html>
